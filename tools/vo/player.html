<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaiju Havoc booth: line player</title>
<style>
  :root { --bg: #14090c; --panel: #1f1116; --line: #3a222b; --text: #f3e6d8; --dim: #b39c93; --mike: #4d8dff; --vance: #b56bff; --gold: #ffcc66; --bad: #ff6b5e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, Segoe UI, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  h1 { margin: 0 0 8px; font-size: 18px; color: var(--gold); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select, button { font: inherit; color: var(--text); background: #2a171e; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  input[type=search] { flex: 1 1 220px; min-width: 160px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.on { background: var(--gold); color: #1a0d05; border-color: var(--gold); }
  label { color: var(--dim); display: inline-flex; gap: 5px; align-items: center; }
  #count { color: var(--dim); margin-left: auto; }
  main { padding: 8px 16px 120px; max-width: 1100px; margin: 0 auto; }
  h2 { margin: 22px 0 6px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  h2 small { color: var(--dim); letter-spacing: 0; text-transform: none; margin-left: 8px; }
  .entry { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--panel); overflow: hidden; }
  .cond { font-size: 12px; color: var(--dim); padding: 3px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .cond button { padding: 1px 8px; font-size: 12px; margin-left: auto; }
  .u { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; cursor: pointer; }
  .u:hover { background: #2a171e; }
  .u.playing { background: #3b2412; outline: 1px solid var(--gold); }
  .u.missing { opacity: 0.5; cursor: default; }
  .who { flex: none; width: 92px; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
  .who.M { color: var(--mike); } .who.V { color: var(--vance); }
  .txt { flex: 1; }
  .meta { flex: none; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .flag { flex: none; padding: 0 7px; font-size: 12px; }
  .flag.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  #wip { max-width: 1100px; margin: 0 auto; padding: 4px 16px 0; }
  #wip h3 { margin: 12px 0 4px; font-size: 13px; color: var(--text); } #wip h3 small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  #prog { display: flex; gap: 12px; align-items: center; margin: 6px 0; }
  #progBar { flex: 1; height: 10px; background: #2a171e; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #progBar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.5s; }
  #progTxt { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 13px; max-width: 100%; }
  .chip:hover { border-color: var(--gold); } .chip.playing { background: #3b2412; border-color: var(--gold); }
  .chip b { color: var(--gold); } .chip.mike b { color: var(--mike); } .chip.vance b { color: var(--vance); }
  .chip small { color: var(--dim); display: block; } .chip.rej { opacity: 0.55; }
  .empty { color: var(--dim); font-size: 13px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 16px; display: flex; gap: 10px; align-items: center; }
  #now { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #flagged { width: 34%; min-width: 180px; font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>Kaiju Havoc booth: line player</h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Search the lines (words, a topic, a clip id)">
    <select id="speaker"><option value="">Both announcers</option><option value="M">Mike Brannigan</option><option value="V">Sterling Vance</option></select>
    <select id="topic"><option value="">All situations</option></select>
    <label title="Only clips recorded in the approved voices"><input id="voiced" type="checkbox" checked> new voices only</label>
    <label><input id="flaggedOnly" type="checkbox"> flagged only</label>
    <button id="playAll">Play all shown</button>
    <button id="stop">Stop</button>
    <span id="count"></span>
  </div>
</header>
<section id="wip">
  <h2>Work in flight <small id="wipWhen"></small></h2>
  <div id="prog"><div id="progBar"><i></i></div><span id="progTxt">Checking…</span></div>
  <div id="per" class="chips"></div>
  <h3>Just recorded <small>newest first; click to hear</small></h3>
  <div id="recent" class="chips"></div>
  <h3>Approved voice references <small>what every line is recorded from</small></h3>
  <div id="refs" class="chips"></div>
  <h3>Test lines in the approved voices</h3>
  <div id="ab" class="chips"></div>
</section>
<main id="list"></main>
<footer>
  <span id="now">Click a line to hear it. Click an entry's "play" to hear the whole exchange.</span>
  <label>volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.9"></label>
  <input id="flagged" readonly placeholder="Lines you flag appear here as ids for: tts.py --redo" title="Click to copy">
</footer>
<script type="module">
// Reads what the game reads (src/wrestling/commentaryLines.js) and plays assets/vo/<id>.mp3.
// Serve the repo root (python -m http.server 8377) and open /tools/vo/player.html.
const ROOT = new URL('../../', import.meta.url);
const { VO_LINES } = await import(new URL('src/wrestling/commentaryLines.js?t=' + Date.now(), ROOT));
const NAME = { M: 'BRANNIGAN', V: 'VANCE' };
const KAIJU = { godzilla: 'Gorrak', mecha: 'Mechra', ghidorah: 'Tridon' };
const COND = { a: 'by', v: 'to', aa: 'by a', va: 'to a', mu: 'match-up', pair: 'pair', lm: 'landmark', m: 'move' };
const $ = (id) => document.getElementById(id);
const list = $('list'), audio = new Audio();
let flagged = new Set(JSON.parse(localStorage.getItem('vo_flag') || '[]'));
let queue = [], playingEl = null;

const condText = (c) => Object.entries(c).map(([k, v]) => `${COND[k] || k} ${String(v).split('+').map((x) => KAIJU[x] || x).join(' + ')}`).join(' · ') || 'any time';
const topics = [...new Set(VO_LINES.map((r) => r[0]))];
for (const t of topics) $('topic').add(new Option(`${t} (${VO_LINES.filter((r) => r[0] === t).length})`, t));

let NEWV = {}; // announcers whose clips are in the approved voice so far: { vance: true, mike: true }
const isNew = (s) => !!NEWV[s === 'M' ? 'mike' : 'vance'];
function render() {
  const q = $('q').value.trim().toLowerCase(), sp = $('speaker').value, tp = $('topic').value, vo = $('voiced').checked, fo = $('flaggedOnly').checked;
  list.textContent = '';
  let n = 0, voicedN = 0, secs = 0, lastTopic = '';
  for (const [topic, cond, lines] of VO_LINES) {
    if (tp && topic !== tp) continue;
    const show = lines.filter(([s, text, id, dur]) => (!sp || s === sp) && (!vo || (dur > 0 && isNew(s))) && (!fo || flagged.has(id)) && (!q || text.toLowerCase().includes(q) || topic.includes(q) || id.includes(q)));
    if (!show.length) continue;
    if (topic !== lastTopic) { const h = document.createElement('h2'); h.textContent = topic; list.append(h); lastTopic = topic; }
    const box = document.createElement('div'); box.className = 'entry';
    const head = document.createElement('div'); head.className = 'cond'; head.textContent = condText(cond);
    if (lines.length > 1) { const b = document.createElement('button'); b.textContent = 'play exchange'; b.onclick = () => playQueue([...box.querySelectorAll('.u:not(.missing)')]); head.append(b); }
    box.append(head);
    for (const [s, text, id, dur] of (vo ? show : lines)) {
      const row = document.createElement('div'); row.className = 'u' + (dur > 0 ? '' : ' missing'); row.dataset.id = id; row.dataset.text = `${NAME[s]}: ${text}`;
      row.innerHTML = `<span class="who ${s}">${NAME[s]}</span><span class="txt"></span><span class="meta">${dur > 0 ? (isNew(s) ? '' : 'OLD voice · ') + dur.toFixed(1) + ' s' : 'not recorded yet'}</span>`;
      row.querySelector('.txt').textContent = text;
      const f = document.createElement('button'); f.className = 'flag' + (flagged.has(id) ? ' on' : ''); f.textContent = 'flag'; f.title = 'Mark this clip as one to record again';
      f.onclick = (ev) => { ev.stopPropagation(); flagged.has(id) ? flagged.delete(id) : flagged.add(id); f.classList.toggle('on'); saveFlags(); };
      row.append(f);
      if (dur > 0) row.onclick = () => playQueue([row]);
      box.append(row);
      n++; if (dur > 0) { voicedN++; secs += dur; }
    }
    list.append(box);
  }
  $('count').textContent = `${n} lines shown, ${voicedN} voiced, ${(secs / 60).toFixed(1)} min of audio`;
}
// ---- work in flight: polled, so new clips, references and test lines show up without a reload ----
const VO = new URL('tools/vo/', ROOT), bust = () => '?t=' + Date.now();
const getJSON = (u) => fetch(new URL(u, VO) + bust(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const exists = (u) => fetch(new URL(u, VO) + bust(), { method: 'HEAD', cache: 'no-store' }).then((r) => r.ok).catch(() => false);
function chip(parent, cls, title, sub, url, text) {
  const c = document.createElement('div'); c.className = 'chip ' + cls;
  c.innerHTML = '<b></b><small></small>'; c.firstChild.textContent = title; c.lastChild.textContent = sub;
  c.onclick = () => { queue = []; if (playingEl) playingEl.classList.remove('playing'); playingEl = c; c.classList.add('playing'); $('now').textContent = text || title; audio.src = new URL(url, VO) + bust(); audio.volume = +$('vol').value; audio.play(); };
  parent.append(c);
}
const fmt = (i) => (i ? `${i.pitch_hz ?? '?'} Hz · range ${i.range_st ?? '?'} st · ${i.words_per_s ?? '?'} words/s${i.male !== undefined ? ' · male ' + i.male : ''}` : '');
let lastSig = '', primed = false;
const recent = [];
async function poll() {
  const [durs, status, design, ab, voices] = await Promise.all([getJSON('out/durations.json'), getJSON('out/status.json'), getJSON('out/design.json'), getJSON('out/ab/index.json'), getJSON('out/voices.json')]);
  const nv = JSON.stringify(voices || {}); let voicesChanged = nv !== JSON.stringify(NEWV); NEWV = voices || {};
  // newly voiced lines become playable at once
  let changed = false, voicedNow = 0, total = 0;
  const per = { M: [0, 0], V: [0, 0] }, seenIds = new Set();
  if (durs) for (const row of VO_LINES) for (const u of row[2]) {
    const d = durs[u[2]] || 0;
    if (d !== u[3]) { if (d > 0 && isNew(u[0]) && primed && !recent.some((r) => r[2] === u[2])) recent.unshift(u); u[3] = d; changed = true; }
    if (seenIds.has(u[2])) continue;
    seenIds.add(u[2]); total++; per[u[0]][1]++;
    if (d > 0 && isNew(u[0])) { voicedNow++; per[u[0]][0]++; }
  }
  primed = true;
  if (changed || voicesChanged) render();
  $('per').innerHTML = `<div class="chip vance"><b>Vance</b><small>${per.V[0]} of ${per.V[1]} lines in the approved voice${NEWV.vance ? '' : ' (not started)'}</small></div><div class="chip mike"><b>Mike</b><small>${per.M[0]} of ${per.M[1]} lines in the approved voice${NEWV.mike ? '' : ' (queued: starts when Vance is done)'}</small></div>`;
  const rc = $('recent'); rc.textContent = '';
  for (const u of recent.slice(0, 14)) chip(rc, u[0] === 'M' ? 'mike' : 'vance', NAME[u[0]], u[1], '../../assets/vo/' + u[2] + '.mp3', `${NAME[u[0]]}: ${u[1]}`);
  if (!rc.children.length) rc.innerHTML = '<span class="empty">' + (status && status.running ? 'Recording now: ' + (status.last || '') + ' (new clips will appear here as they finish)' : 'Nothing recorded since this page was opened.') + '</span>';
  $('progBar').firstChild.style.width = total ? (100 * voicedNow / total).toFixed(1) + '%' : '0';
  $('progTxt').textContent = `${voicedNow} of ${total} lines in the new voices` + (status && status.running ? ` · recording ${status.speaker === 'mike' ? 'Mike' : 'Vance'} now: ${status.done}/${status.todo}, ${status.sPerLine} s a line, about ${status.minLeft} min left (${status.engine})` : status && status.note ? ' · ' + status.note : ' · no recording run active');
  $('wipWhen').textContent = 'updated ' + new Date().toLocaleTimeString();
  const sig = JSON.stringify([design, ab]);
  if (sig === lastSig) return;
  lastSig = sig;
  const refs = $('refs'); refs.textContent = '';
  if (await exists('ref_mike.approved.wav')) chip(refs, 'mike', 'Mike · approved', 'deep, commanding, full cry', 'ref_mike.approved.wav');
  for (const heat of ['hot', 'talk']) if (await exists(`ref_vance_${heat}.approved.wav`)) chip(refs, 'vance', `Vance · approved · ${heat === 'hot' ? 'full cry' : 'banter'}`, heat === 'hot' ? 'gloating at full volume' : 'needling his partner', `ref_vance_${heat}.approved.wav`);
  if (!refs.children.length) refs.innerHTML = '<span class="empty">None yet.</span>';
  const abEl = $('ab'); abEl.textContent = '';
  for (const t of (ab || []).filter((t) => !/^First try/.test(t.method))) chip(abEl, t.who, `${t.method} · ${t.who === 'mike' ? 'Mike' : 'Vance'}`, t.text + (t.info ? ' — ' + t.info : ''), 'out/ab/' + t.file, t.text);
  if (!abEl.children.length) abEl.innerHTML = '<span class="empty">None yet.</span>';
}
poll(); setInterval(poll, 5000);
function saveFlags() { localStorage.setItem('vo_flag', JSON.stringify([...flagged])); $('flagged').value = [...flagged].join(','); }
function playQueue(rows) { queue = rows.slice(); next(); }
function next() {
  if (playingEl) playingEl.classList.remove('playing');
  const row = queue.shift();
  if (!row) { playingEl = null; $('now').textContent = 'Done.'; return; }
  playingEl = row; row.classList.add('playing'); row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  $('now').textContent = row.dataset.text;
  audio.src = new URL(`assets/vo/${row.dataset.id}.mp3`, ROOT) + '?t=' + Date.now(); audio.volume = +$('vol').value;
  audio.play().catch(() => { $('now').textContent = 'Could not play ' + row.dataset.id; setTimeout(next, 300); });
}
audio.onended = () => setTimeout(next, 180);
$('stop').onclick = () => { queue = []; audio.pause(); if (playingEl) playingEl.classList.remove('playing'); $('now').textContent = 'Stopped.'; };
$('playAll').onclick = () => playQueue([...list.querySelectorAll('.u:not(.missing)')]);
$('vol').oninput = () => { audio.volume = +$('vol').value; };
$('flagged').onclick = () => { $('flagged').select(); navigator.clipboard?.writeText($('flagged').value); };
for (const id of ['q', 'speaker', 'topic', 'voiced', 'flaggedOnly']) $(id).addEventListener('input', render);
saveFlags(); render();
</script>
</body>
</html>
